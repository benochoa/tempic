; PlatformIO project for the TMP119 temperature sensor on a Teensy 4.1.
;
; Two separate programs live in this project:
;   pio run -e teensy41 -t upload   -> main firmware (src/main.cpp)
;   pio run -e scanner  -t upload   -> I2C bus scanner (src/i2c_scanner.cpp)
; Open the serial monitor with:  pio device monitor

[platformio]
default_envs = teensy41

; Settings shared by every environment below.
[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

[env:teensy41]
build_src_filter = +<main.cpp>

[env:scanner]
build_src_filter = +<i2c_scanner.cpp>
